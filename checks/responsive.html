<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Verificação responsiva — Eduardo Henrique</title><style>body{font:14px system-ui;background:#303030;color:white;margin:0}header{padding:14px;position:sticky;top:0;background:#303030;z-index:2}button{padding:8px;margin-right:8px;cursor:pointer}iframe{display:block;border:0;background:#080808;height:850px;transform-origin:top left}#stage{overflow:auto;padding:10px}#report{white-space:pre-wrap;line-height:1.6}</style></head><body><header><strong>Verificação local • largura em pixels</strong><p><button data-width="360">360</button><button data-width="768">768</button><button data-width="1024">1024</button><button data-width="1440">1440</button><button id="verify">Verificar largura atual</button></p><div id="report">Carregando…</div></header><div id="stage"><iframe id="site" title="Portfólio em teste" src="/" style="width:360px"></iframe></div><script>
const site=document.querySelector('#site'); const report=document.querySelector('#report');
async function verify(){await site.contentDocument.fonts.ready;const doc=site.contentDocument;const width=doc.documentElement.clientWidth;const overflow=doc.documentElement.scrollWidth>width;const links=[...doc.querySelectorAll('a[href^="#"]')];const broken=links.filter(a=>!doc.querySelector(a.getAttribute('href')));const controls=[...doc.querySelectorAll('input,select,textarea')];const unlabeled=controls.filter(c=>!doc.querySelector('label[for="'+c.id+'"]'));report.textContent=JSON.stringify({viewport:width,scrollWidth:doc.documentElement.scrollWidth,horizontalOverflow:overflow,brokenAnchors:broken.length,unlabeledFields:unlabeled.length,projectButtons:doc.querySelectorAll('.project-open').length,whatsappLinks:doc.querySelectorAll('a[href*="wa.me"]').length,submitDisabled:doc.querySelector('button[type="submit"]').disabled},null,2)}
site.addEventListener('load',verify);document.querySelector('#verify').addEventListener('click',verify);document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{site.style.width=button.dataset.width+'px';requestAnimationFrame(()=>requestAnimationFrame(verify))}));
</script></body></html>
